<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FriendFlix - Home</title>
  <link rel="stylesheet" href="HomeScreen.css" />
  <link rel="icon" href="Icons/favicon.png" type="image/png">
  <script src="HomeScreenData.js"></script>
  <script  type="module" src="HomeScreen.js" ></script>
</head>
<body>
  <header>
  <div style="display: flex; align-items: center;">
    <img src="Icons/FriendFlix.png" class="logo" alt="FriendFlix Logo">
    <nav>
      <a href="#" id="homeLink">Home</a>
      <a href="#">TV Shows</a>
      <a href="#">Movies</a>
      <a href="#" id="myListLink">My List</a>
    </nav></div>
	<div style="display:flex">
	<div class="search-box">
	  <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Titles,people,genres..." />
    </div>
	<div class="profile-dropdown" id="profileDropdown">
   <img id="activeProfileIcon" class="active-profile-icon" src="Profiles/red.jpg" alt="Profile" />
   <span class="dropdown-arrow">▾</span>
  <div class="dropdown-menu" id="profileMenu">
    <!-- Profiles from Firebase will go here -->
    <div class="divider"></div>
    <div class="exit-profile" id="exitProfile">Exit Profile</div>
    <div class="signout-item" id="signOutBtn">Sign out of FriendFlix</div>
  </div>
</div>
</div>

  </header>
<div class="main-content" id="mainContent">
<div class="main-video-container" id="mainContainer">
    <video class="main-video" id="mainVideo" autoplay loop muted>
      <source id="mainVideoSource" src="" type="video/mp4">
    </video>
    <div class="hero-overlay">
      <h1 class="hero-title" id="heroTitle"></h1>
      <h3 class="hero-subtitle" id="heroSubtitle"></h3>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-buttons">
        <button id="playFullscreen" class="btn play">▶ Play</button>
        <button class="btn info" id="infoBtn">ℹ More Info</button>
      </div>
    </div>
    <div class="controls right-controls">
      <button id="muteToggle">🔇</button>
    </div>
  </div>

  <div id="videoSections"></div>
  
  <div class="more-info-modal" id="moreInfo">
    <div class="description" id="moreInfoContent"></div>
	<img id="modalPoster" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:1;" />
    <video class="modal-video" id="modalVideo" autoplay loop muted playsinline>
       <source id="modalVideoSource" src="" type="video/mp4">
    </video>
      <button class="close-btn"  id="closeInfo">&times;</button>
	   <button class="play-btn"  id="playVideo">▶ Play</button>
    <div class="content">
      <h1 id="infoTitle"></h1>
      <div class="meta"  id="infoMeta"></div>
      <div class="description"  id="infoDescription">
      </div>
    </div>
  </div>
   <div id="moreInfoBackdrop"></div>
 </div>  
   
<div class="search-results" id="searchResults"></div>
  <div class="fullscreen-player" id="fullscreenPlayer">
    <button id="exitFullscreen" style="position: absolute; top: 20px; left: 30px; font-size: 30px; background: transparent; border: none; color: white; z-index: 9999; cursor: pointer;">←</button>
    <video id="fullscreenVideo" controls autoplay></video>
  </div>

</body>
</html>
